# Site settings for Clustered Thoughts (TeXt theme)
# https://kitian616.github.io/jekyll-TeXt-theme/docs/en/configuration

theme: jekyll-text-theme

## => Site Settings
text_skin: dark
highlight_theme: tomorrow-night-blue
url: "https://herms14.github.io"
baseurl: "/Clustered-Thoughts"
title: Clustered Thoughts
description: >-
  Notes on infrastructure, automation, and supervised AI. A homelab journal on Proxmox, self-hosting,
  and putting AI agents to work on real infrastructure with a human in the loop.

## => Language and Timezone
lang: en
timezone: Asia/Manila

## => Author and Social
author:
  type: person
  name: Hermes Miraflor II
  avatar: https://github.com/herms14.png
  bio: Homelabber in the Philippines. Writing about Proxmox, self-hosting, and AI agents that run real infrastructure with a human approving every change.
  linkedin: hrmsmrflr
  github: herms14

## => GitHub Repository
repository: herms14/Clustered-Thoughts
repository_tree: main

## => Paths
paths:
  root: /
  home: /
  archive: /archive.html
  rss: /feed.xml

## => Post
excerpt_separator: <!--more-->
license: false
toc:
  selectors: "h2,h3"

## => Paginate
paginate: 8
paginate_path: /page:num

## => Sources
sources: unpkg

## => Sharing / comments / pageview / analytics
sharing:
  provider: false
comments:
  provider: false
pageview:
  provider: false
analytics:
  provider: false

## => Search
search:
  provider: default

## => Build
markdown: kramdown
highlighter: rouge
permalink: /posts/:title/

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - scripts
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      sharing: false
      license: false
      aside:
        toc: true
      show_edit_on_github: false
      show_subscribe: true
      pageview: false

## => Plugins
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
