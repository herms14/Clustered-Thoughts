# Site settings for Clustered Thoughts (Minimal Mistakes theme)
# https://mmistakes.github.io/minimal-mistakes/docs/configuration/

theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "dark"

locale: "en-US"
title: "Clustered Thoughts"
subtitle: "Notes on infrastructure, automation, and supervised AI"
name: "Hermes Miraflor II"
description: >-
  Notes on infrastructure, automation, and supervised AI. A homelab journal on Proxmox, self-hosting,
  and putting AI agents to work on real infrastructure with a human in the loop.
url: "https://herms14.github.io"
baseurl: "/Clustered-Thoughts"
repository: "herms14/Clustered-Thoughts"
timezone: Asia/Manila

teaser: /assets/img/posts/homelab-cover.jpg
og_image: /assets/img/posts/homelab-cover.jpg
words_per_minute: 200
breadcrumbs: false
search: true
search_full_content: true
search_provider: lunr

author:
  name: "Hermes Miraflor II"
  avatar: "https://github.com/herms14.png"
  bio: "Homelabber in the Philippines. Writing about Proxmox, self-hosting, and AI agents that run real infrastructure with a human approving every change."
  location: "Philippines"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/herms14"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/hrmsmrflr/"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/herms14"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/hrmsmrflr/"

# Reading
include:
  - _pages
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - scripts
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /posts/:title/
paginate: 6
paginate_path: /page:num/
date_format: "%B %-d, %Y"

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      share: true
      related: true
      toc: true
      toc_sticky: true
      toc_label: "On this page"
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
